<div class="character-select">
    <h4>SELECT CHARACTER</h4>
    <div class="char-selector">
        <button class="char-arrow" id="charPrev">◀</button>
        <div class="char-preview-container">
            <canvas id="charPreview" width="80" height="80"></canvas>
            <span class="char-name" id="charName">Pikachu</span>
        </div>
        <button class="char-arrow" id="charNext">▶</button>
    </div>
    <span class="char-hint">Use [ ] or ← → to change</span>
</div>
