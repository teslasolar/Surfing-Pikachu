<div class="instructions">
    <h3>HOW TO PLAY</h3>
    <p><strong>← →</strong> Arrow Keys to flip while in the air</p>
    <p><strong>↑ / Space</strong> to jump off waves</p>
    <p>Land flat on the water to avoid crashing!</p>
    <div class="gamepad-info">
        <p><strong>Gamepad:</strong> A/B to jump, Left Stick to flip</p>
    </div>
    <div class="scoring-info">
        <h4>SCORING</h4>
        <p>1 Flip: 50 pts | 2 Flips: 150 pts | 3 Flips: 500 pts</p>
    </div>
</div>
